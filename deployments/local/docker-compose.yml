services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: POINTOFSALE
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_parallel_maintenance_workers=4"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
      - "-c"
      - "superuser_reserved_connections=10"
      - "-c"
      - "idle_in_transaction_session_timeout=60000" 
      - "-c"
      - "statement_timeout=30000"
    ports:
      - "5432:5432"
    volumes:
      - postgres_pointofsale_data:/var/lib/postgresql/data
    networks:
      - app_pointofsale_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d POINTOFSALE"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter_pointofsale
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://DRAGON:DRAGON@postgres:5432/POINTOFSALE?sslmode=disable&connect_timeout=10"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - app_pointofsale_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer_pointofsale
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: DRAGON
      DB_PASSWORD: DRAGON
      DB_NAME: POINTOFSALE
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 200
      MIN_POOL_SIZE: 50
      MAX_DB_CONNECTIONS: 800
      MAX_CLIENT_CONN: 10000
      RESERVE_POOL_SIZE: 100
      RESERVE_POOL_TIMEOUT: 5
      SERVER_IDLE_TIMEOUT: 600
      QUERY_TIMEOUT: 30
      SERVER_CONNECT_TIMEOUT: 10
      SERVER_LOGIN_RETRY: 5
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_RESET_QUERY_ALWAYS: 0
      TCP_KEEPALIVE: 1
      TCP_KEEPCNT: 5
      TCP_KEEPIDLE: 30
      TCP_KEEPINTVL: 10
      ADMIN_USERS: DRAGON
      STATS_USERS: DRAGON
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      LOG_POOLER_ERRORS: 1
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_pointofsale_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=DRAGON psql -h localhost -p 5432 -U DRAGON -d pgbouncer -c 'SHOW POOLS;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  pyroscope:
    image: grafana/pyroscope:latest
    ports:
      - "4040:4040"
    networks:
      - app_pointofsale_network

  migrate:
    image: migrate-pointofsale-service:1.0
    container_name: migrate
    volumes:
      - ./docker.env:/app/docker.env
      - ../../pkg/database/migrations:/app/pkg/database/migrations
    env_file: ./docker.env
    environment:
      APP_ENV: docker
      DB_URL: postgres://DRAGON:DRAGON@postgres/POINTOFSALE
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy

  apigateway:
    image: apigateway-pointofsale-service:1.0
    container_name: apigateway_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "5000:5000"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      auth:
        condition: service_started
      role:
        condition: service_started
      user:
        condition: service_started
      category:
        condition: service_started
      merchant:
        condition: service_started
      orderitem:
        condition: service_started
      order:
        condition: service_started
      product:
        condition: service_started
      transaction:
        condition: service_started
      redis_apigateway:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_apigateway
      - REDIS_DB=0

  auth:
    image: auth-pointofsale-service:1.0
    container_name: auth_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50051:50051"
      - "8081:8081"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_auth:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_auth
      - REDIS_DB=0

  role:
    image: role-pointofsale-service:1.0
    container_name: role_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50052:50052"
      - "8082:8082"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_role:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_role
      - REDIS_DB=0

  user:
    image: user-pointofsale-service:1.0
    container_name: user_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50053:50053"
      - "8083:8083"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_user:
        condition: service_started
      role:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_user
      - REDIS_DB=0

  category:
    image: category-pointofsale-service:1.0
    container_name: category_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50054:50054"
      - "8084:8084"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_category:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_category
      - REDIS_DB=0

  cashier:
    image: cashier-pointofsale-service:1.0
    container_name: cashier_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50055:50055"
      - "8085:8085"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_cashier:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_cashier
      - REDIS_DB=0

  merchant:
    image: merchant-pointofsale-service:1.0
    container_name: merchant_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50056:50056"
      - "8086:8086"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_merchant:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_merchant
      - REDIS_DB=0

  orderitem:
    image: order_item-pointofsale-service:1.0
    container_name: orderitem_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50057:50057"
      - "8087:8087"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_orderitem:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_orderitem
      - REDIS_DB=0

  order:
    image: order-pointofsale-service:1.0
    container_name: order_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50058:50058"
      - "8088:8088"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_order:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_order
      - REDIS_DB=0

  product:
    image: product-pointofsale-service:1.0
    container_name: product_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50059:50059"
      - "8089:8089"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_product:
        condition: service_started
      category:
        condition: service_started
      merchant:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_product
      - REDIS_DB=0

  transaction:
    image: transaction-pointofsale-service:1.0
    container_name: transaction_pointofsale
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
    ports:
      - "50060:50060"
      - "8090:8090"
    networks:
      - app_pointofsale_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis_transaction:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis_transaction
      - REDIS_DB=0

  kafka:
    image: apache/kafka:latest
    container_name: my-kafka-pointofsale
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CLUSTER_ID: kraft-cluster-01
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - app_pointofsale_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter_pointofsale
    ports:
      - "9308:9308"
    networks:
      - app_pointofsale_network
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=my-kafka-pointofsale:9092"
      - "--web.listen-address=0.0.0.0:9308"
      - "--log.level=debug"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:9308/metrics || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_pointofsale
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/rules:/etc/prometheus/rules
    networks:
      - app_pointofsale_network
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_pointofsale
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_pointofsale-storage:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - app_pointofsale_network
    depends_on:
      - prometheus
      - jaeger
      - alertmanager
      - loki

  nginx:
    image: nginx:alpine
    container_name: nginx_pointofsale
    ports:
      - "80:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - apigateway
    networks:
      - app_pointofsale_network

  redis_apigateway:
    image: redis:7.4
    container_name: redis_apigateway
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6379:6379"
    volumes:
      - redis_apigateway_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_auth:
    image: redis:7.4
    container_name: redis_auth
    command: >
      redis-server
      --requirepass dragon_knight
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --maxclients 10000
    ports:
      - "6380:6379"
    volumes:
      - redis_auth_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_role:
    image: redis:7.4
    container_name: redis_role
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6381:6379"
    volumes:
      - redis_role_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_user:
    image: redis:7.4
    container_name: redis_user
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6382:6379"
    volumes:
      - redis_user_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_category:
    image: redis:7.4
    container_name: redis_category
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6383:6379"
    volumes:
      - redis_category_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_cashier:
    image: redis:7.4
    container_name: redis_cashier
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6384:6379"
    volumes:
      - redis_cashier_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_merchant:
    image: redis:7.4
    container_name: redis_merchant
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6385:6379"
    volumes:
      - redis_merchant_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_orderitem:
    image: redis:7.4
    container_name: redis_orderitem
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6386:6379"
    volumes:
      - redis_orderitem_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_order:
    image: redis:7.4
    container_name: redis_order
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6387:6379"
    volumes:
      - redis_order_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_product:
    image: redis:7.4
    container_name: redis_product
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6388:6379"
    volumes:
      - redis_product_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  redis_transaction:
    image: redis:7.4
    container_name: redis_transaction
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6389:6379"
    volumes:
      - redis_transaction_data:/data
    restart: unless-stopped
    networks:
      - app_pointofsale_network

  node-exporter:
    image: quay.io/prometheus/node-exporter
    container_name: node-exporter_pointofsale
    pid: "host"
    networks:
      - app_pointofsale_network
    volumes:
      - "/:/host:ro,rslave"
    command:
      - '--path.rootfs=/host'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector_pointofsale
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../observability/otel-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8889:8889"
    networks:
      - app_pointofsale_network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger_pointofsale
    ports:
      - "6831:6831/udp"
      - "16686:16686"
    networks:
      - app_pointofsale_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager_pointofsale
    volumes:
      - ../../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - app_pointofsale_network

  loki:
    image: grafana/loki:2.9.0
    container_name: loki_pointofsale
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_pointofsale_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_pointofsale_network

volumes:
  loki_pointofsale_data:
  grafana_pointofsale-storage:
  postgres_pointofsale_data:
  kafka_pointofsale_data:
  redis_apigateway_data:
  redis_auth_data:
  redis_role_data:
  redis_user_data:
  redis_category_data:
  redis_cashier_data:
  redis_merchant_data:
  redis_orderitem_data:
  redis_order_data:
  redis_product_data:
  redis_transaction_data:

networks:
  app_pointofsale_network:
    driver: bridge
